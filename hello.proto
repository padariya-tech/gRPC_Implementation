syntax = "proto3";

package hello;

service HelloService {
    rpc SayHello (HelloRequest) returns (HelloResponse);
    rpc AddNumbers (AddRequest) returns (AddResponse);
}

message HelloRequest{
    string name = 1;
}

message HelloResponse{
    string message = 1;
}

message AddRequest{
    int32 num1 = 1;
    int32 num2 = 2;
}

message AddResponse {
  int32 result = 1;
}